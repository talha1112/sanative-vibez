name: sanative_vibez
description: "Sanative Vibez is a serene mobile-first wellness companion designed to help you gently reset, reflect, and cultivate a sense of calm in your daily life."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  url_launcher: ^6.0.0
  intl: ^0.19.0
  shared_preferences: ^2.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  provider: ^6.1.2
  go_router: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/Untitled_design_6.png
  color: "#523B51" # Deep-plum background
  remove_alpha_ios: true
